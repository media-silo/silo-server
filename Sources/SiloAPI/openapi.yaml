        speed:
          type: number
        updatedAt:
          type: string
          format: date-time

    EncodeResult:
      type: object
      required: [streams, layoutMatched]
      properties:
        sizeBytes:
          type: integer
          format: int64
        streams:
          type: array
          items:
            type: string
        layoutMatched:
          type: boolean

    PlacementSummary:
      type: object
      required: [destination, writes, placedAt]
      properties:
        destination:
          type: string
        presentation:
          type: string
        writes:
          type: array
          items:
            type: string
        placedAt:
          type: string
          format: date-time

    Job:
      type: object
      required: [id, state, createdAt, updatedAt, source, requirements, attempts]
      properties:
        id:
          type: string
        state:
          $ref: "#/components/schemas/JobState"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        source:
          $ref: "#/components/schemas/FileRef"
        discName:
          type: string
        probe:
          $ref: "#/components/schemas/ProbedSource"
        makeMKV:
          $ref: "#/components/schemas/MakeMKVFacts"
        assignment:
          $ref: "#/components/schemas/Assignment"
        facts:
          $ref: "#/components/schemas/SourceFacts"
        recipe:
          $ref: "#/components/schemas/Recipe"
        requirements:
          type: array
          items:
            type: string
        attempts:
          type: array
          items:
            $ref: "#/components/schemas/Attempt"
        lease:
          $ref: "#/components/schemas/Lease"
        progress:
          $ref: "#/components/schemas/Progress"
        output:
          $ref: "#/components/schemas/FileRef"
        result:
          $ref: "#/components/schemas/EncodeResult"
        placement:
          $ref: "#/components/schemas/PlacementSummary"
        failure:
          type: string

    NodeState:
      type: string
      enum: [pending, approved, revoked]

    Node:
      type: object
      required: [id, name, platform, state, capabilities, registeredAt]
      properties:
        id:
          type: string
        name:
          type: string
        platform:
          type: string
        state:
          $ref: "#/components/schemas/NodeState"
        capabilities:
          type: array
          items:
            type: string
        ffmpegVersion:
          type: string
        cores:
          type: integer
        registeredAt:
          type: string
          format: date-time
        approvedAt:
          type: string
          format: date-time
        lastSeenAt:
          type: string
          format: date-time

    NodeRegistration:
      type: object
      required: [id, secret, name, platform, capabilities]
      properties:
        id:
          type: string
        secret:
          type: string
        name:
          type: string
        platform:
          type: string
        capabilities:
          type: array
          items:
            type: string
        ffmpegVersion:
          type: string
        cores:
          type: integer

    NodeStatus:
      type: object
      required: [node]
      properties:
        node:
          $ref: "#/components/schemas/Node"
        token:
          type: string

    ClaimRequest:
      type: object
      required: [node, capabilities]
      properties:
        node:
          type: string
        capabilities:
          type: array
          items:
            type: string

    ClaimReply:
      type: object
      properties:
        job:
          $ref: "#/components/schemas/Job"

    ProgressReply:
      type: object
      required: [state]
      properties:
        state:
          $ref: "#/components/schemas/JobState"

    CompleteRequest:
      type: object
      required: [output, result]
      properties:
        output:
          $ref: "#/components/schemas/FileRef"
        result:
          $ref: "#/components/schemas/EncodeResult"

    FailRequest:
      type: object
      required: [reason]
      properties:
        reason:
          type: string

    ContainerSummary:
      type: object
      required: [id, library, type, title, displayTitle, listed]
      properties:
        id:
