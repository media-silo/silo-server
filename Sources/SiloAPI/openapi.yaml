          items:
            type: string
        item:
          type: string
        alternative:
          type: string
        profile:
          type: string
        tracks:
          type: array
          items:
            $ref: "#/components/schemas/TrackMapping"
        chapters:
          type: array
          items:
            $ref: "#/components/schemas/Chapter"
        source:
          $ref: "#/components/schemas/SourceRef"
        ruleset:
          type: string
        rulesetVersion:
          type: integer

    Attempt:
      type: object
      required: [node, startedAt]
      properties:
