          items:
            $ref: "#/components/schemas/ProbedStream"

    ProbedStream:
      type: object
      required: [absoluteIndex, kind, codec, dispositions]
      properties:
        absoluteIndex:
          type: integer
        kind:
          type: string
          enum: [video, audio, subtitle, data, attachment, other]
        codec:
          type: string
        profile:
          type: string
        width:
          type: integer
        height:
          type: integer
        frameRate:
          type: number
        fieldOrder:
          type: string
        colorTransfer:
          type: string
        pixelFormat:
          type: string
        bitsPerRawSample:
          type: integer
        channels:
          type: integer
        channelLayout:
          type: string
        language:
          type: string
        title:
          type: string
        dispositions:
          type: array
          items:
            type: string

    MakeMKVFacts:
      type: object
      required: [tracks]
      properties:
        format:
          type: string
          enum: [dvd, bluray, uhd]
        tracks:
          type: array
          items:
            $ref: "#/components/schemas/MakeMKVTrack"

    MakeMKVTrack:
      type: object
      required: [kind, flags, core, forcedOnly]
      properties:
        kind:
          $ref: "#/components/schemas/StreamKind"
        codecId:
          type: string
        language:
          type: string
        channels:
          type: integer
        flags:
          type: integer
        core:
          type: boolean
        forcedOnly:
          type: boolean

    Assignment:
      type: object
      required: [library, containers, item, tracks, chapters, ruleset]
