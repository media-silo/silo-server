        title:
          type: string
        displayTitle:
          type: string
        year:
          type: integer
        typeLabel:
          type: string
        outline:
          type: string
        listed:
          type: boolean
        parent:
          type: string

    Container:
      type: object
      required: [id, library, type, title, displayTitle, listed, alternatives, features, sequences, extras, children, externalRefs]
      properties:
        id:
          type: string
        library:
          type: string
        type:
          type: string
        title:
          type: string
        displayTitle:
          type: string
        year:
          type: integer
        typeLabel:
          type: string
        outline:
          type: string
        listed:
          type: boolean
        parent:
          type: string
        defaultAlternative:
          type: string
        alternatives:
          type: array
          items:
            $ref: "#/components/schemas/Alternative"
        features:
          type: array
          items:
            $ref: "#/components/schemas/Feature"
        sequences:
          type: array
          items:
            $ref: "#/components/schemas/Sequence"
        extrasAnchor:
          type: string
        extras:
          type: array
          items:
            $ref: "#/components/schemas/Item"
        children:
          type: array
          items:
            $ref: "#/components/schemas/ContainerSummary"
        externalRefs:
          type: array
          items:
            $ref: "#/components/schemas/ExternalRef"

    Alternative:
      type: object
      required: [id, sequence]
      properties:
        id:
          type: string
        sequence:
          type: string
        title:
          type: string
        outline:
          type: string

    Feature:
      type: object
      required: [id, type, participants]
      properties:
        id:
          type: string
        type:
          type: string
        title:
          type: string
        participants:
          type: array
          items:
            $ref: "#/components/schemas/Participant"

    Participant:
      type: object
      required: [name]
      properties:
        name:
          type: string
        role:
          type: string

    Sequence:
      type: object
      required: [exploded, items]
      properties:
        id:
          type: string
        exploded:
          type: string
          enum: [never, allowed, preferred]
        items:
          type: array
          items:
            $ref: "#/components/schemas/Item"

    Item:
      type: object
      required: [optional, externalRefs, presentations]
      properties:
        id:
          type: string
        type:
          type: string
        title:
          type: string
        outline:
          type: string
        optional:
          type: boolean
        container:
          type: string
          description: The child container, for an item of type container.
        ref:
          type: string
          description: "`<container id>#<item>` or a bare item id, for an item that is a position in this order and lives elsewhere."
        externalRefs:
          type: array
          items:
            $ref: "#/components/schemas/ExternalRef"
        presentations:
          type: array
          items:
            $ref: "#/components/schemas/Presentation"

    ExternalRef:
      type: object
      required: [provider, value]
      properties:
        provider:
          type: string
        value:
          type: string

    Presentation:
      type: object
      required: [id, file, tracks, chapters]
      properties:
        id:
          type: string
          description: Stable across rescans; what the media route takes.
        alternative:
          type: string
        profile:
          type: string
        displayName:
          type: string
        file:
          type: string
        source:
          $ref: "#/components/schemas/SourceRef"
        tracks:
          type: array
          items:
            $ref: "#/components/schemas/TrackMapping"
        chapters:
          type: array
          items:
            $ref: "#/components/schemas/Chapter"

    SourceRef:
      type: object
      required: [disc, playlist]
      properties:
        disc:
          type: string
        playlist:
          type: string

    TrackMapping:
      type: object
      required: [feature]
      properties:
        feature:
          type: string
        audio:
          type: integer
          description: From one, among the file's audio streams.
        subtitle:
          type: integer
          description: From one, among the file's subtitle streams.

    Chapter:
      type: object
      required: [index, title]
      properties:
        index:
          type: integer
        title:
          type: string

    SearchHit:
      type: object
      required: [container, title]
      properties:
        container:
          type: string
        item:
          type: string
        title:
          type: string

    RulesetSummary:
      type: object
      required: [name, version]
      properties:
        name:
          type: string
        version:
          type: integer

    RulesetDocument:
      type: object
      required: [name, document]
      properties:
        name:
          type: string
        version:
          type: integer
          description: Assigned by the silo; ignored on a store.
        document:
          type: string
          description: The ruleset's XML.

    ResolveRequest:
      type: object
      required: [facts]
      properties:
        facts:
          $ref: "#/components/schemas/SourceFacts"
        mappings:
          type: array
          items:
            $ref: "#/components/schemas/TrackMapping"

    SourceFacts:
      type: object
      required: [audio, subtitles, hints]
      properties:
        kind:
          type: string
        profile:
          type: string
        format:
          type: string
          enum: [dvd, bluray, uhd]
        duration:
          type: number
        video:
          $ref: "#/components/schemas/VideoFacts"
        audio:
          type: array
          items:
            $ref: "#/components/schemas/AudioFacts"
        subtitles:
          type: array
          items:
            $ref: "#/components/schemas/SubtitleFacts"
        hints:
          type: array
          items:
            $ref: "#/components/schemas/FactHint"

    VideoFacts:
      type: object
      required: [absoluteIndex, codec, width, height, interlaced]
      properties:
        absoluteIndex:
          type: integer
        codec:
          type: string
        width:
          type: integer
        height:
          type: integer
        frameRate:
          type: number
        interlaced:
          type: boolean
        hdr:
          type: string
          enum: [hdr10, hlg]
        bitDepth:
          type: integer

    AudioFacts:
      type: object
      required: [index, absoluteIndex, codec, lossless, channels, role, core]
      properties:
        index:
          type: integer
        absoluteIndex:
          type: integer
        codec:
          type: string
        profile:
          type: string
        lossless:
          type: boolean
        channels:
          type: integer
        layout:
          type: string
        language:
          type: string
        role:
          type: string
          enum: [main, commentary, isolatedMusic, descriptive, other]
        core:
          type: boolean
        title:
          type: string

    SubtitleFacts:
      type: object
      required: [index, absoluteIndex, codec, forced, hearingImpaired]
      properties:
        index:
          type: integer
        absoluteIndex:
          type: integer
        codec:
          type: string
        language:
          type: string
        forced:
          type: boolean
        hearingImpaired:
          type: boolean
        title:
          type: string

    FactHint:
      type: object
      required: [text]
      properties:
        stream:
          type: integer
        text:
          type: string

    Recipe:
      type: object
      required: [ruleset, decisions, output, layout, warnings]
      properties:
        ruleset:
          $ref: "#/components/schemas/RulesetRef"
        decisions:
          type: array
          items:
            $ref: "#/components/schemas/StreamDecision"
        output:
          $ref: "#/components/schemas/OutputPolicy"
        layout:
          $ref: "#/components/schemas/OutputLayout"
        warnings:
          type: array
          items:
            type: string

    RulesetRef:
      type: object
      required: [name]
      properties:
        name:
          type: string
        version:
          type: integer

    StreamDecision:
      type: object
      required: [kind, sourceIndex, sourceAbsoluteIndex, rule, action]
      properties:
        kind:
          $ref: "#/components/schemas/StreamKind"
        sourceIndex:
          type: integer
        sourceAbsoluteIndex:
          type: integer
        rule:
          type: string
        action:
          $ref: "#/components/schemas/Action"

    StreamKind:
      type: string
      enum: [video, audio, subtitle]

    Action:
      type: object
      description: >
        Swift's encoding of an enum with associated values: exactly one key, `copy` or `drop`
        with an empty object, or `encode` holding the settings.
      properties:
        copy:
          type: object
        drop:
          type: object
        encode:
          type: object
          required: [_0]
          properties:
            _0:
              $ref: "#/components/schemas/EncodeSettings"

    EncodeSettings:
      type: object
      required: [codec, filters, options]
      properties:
        codec:
          type: string
        preset:
          type: string
        crf:
          type: integer
        bitrate:
          type: string
        channels:
          type: integer
        pixelFormat:
          type: string
        filters:
          type: array
          items:
            type: object
            additionalProperties: true
        options:
          type: object
          additionalProperties:
            type: string

    OutputPolicy:
      type: object
      required: [container]
      properties:
        container:
          type: string

    OutputLayout:
      type: object
      required: [streams]
      properties:
        streams:
          type: array
          items:
            $ref: "#/components/schemas/LayoutStream"

    LayoutStream:
      type: object
      required: [kind, sourceIndex, sourceAbsoluteIndex, outputIndex, outputAbsoluteIndex]
      properties:
        kind:
          $ref: "#/components/schemas/StreamKind"
        sourceIndex:
          type: integer
        sourceAbsoluteIndex:
          type: integer
        outputIndex:
          type: integer
        outputAbsoluteIndex:
          type: integer
