openapi: "3.1.0"
info:
  title: Silo
  version: "1.0.0"
  description: >
    A silo serves one household's libraries of smd-shaped containers. The read routes follow the
    smddb hosting proposal's, so that a client reading the shared store finds a library familiar;
    the rest is what making a library needs. Silo.md is the argument.

    Two routes stream bytes and are served beside this document rather than described in it, since
    an operation buffers its body whole: GET /v1/media/{presentation} is the file, with Range,
    ETag and Accept-Ranges, 206 for a part and 416 for a range the file cannot satisfy; and
    GET /v1/containers/{id}/smd is the container as its sidecar, as application/xml.

servers:
  - url: /v1

tags:
  - name: Server
  - name: Libraries
  - name: Containers
  - name: Rulesets
  - name: Sources
  - name: Bindings
  - name: Jobs
  - name: Nodes

paths:
  /server:
    get:
      operationId: getServer
      summary: Who this silo is
      description: >
        The server's id, the name it goes by, and whether it is in bootstrap — waiting on an
        operator's setup. Open: a Bonjour browse already tells everything this answers, and none
        of it is a credential.
      tags: [Server]
      responses:
        "200":
          description: The server's identity.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServerInfo"

  /setup:
    post:
      operationId: stageSetup
      summary: Stage the server's only setup
      description: >
        Open — the one call a bootstrap server exists to serve, and refused on any other. Stages
        the passkey and name in memory for ten minutes and writes nothing; only its confirm ever
        reaches the state directory. 409 while a stage stands, 410 once the server is set up,
        for good.
      tags: [Server]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetupRequest"
      responses:
        "202":
          description: The staged setup.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SetupStage"
        "400":
          description: An empty passkey.
        "409":
          description: A setup is staged already; confirm or expire it. Carries the standing stage's deadline.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SetupConflict"
        "410":
          description: The server is set up; this was only ever open in bootstrap.

  /setup/confirm:
    post:
      operationId: confirmSetup
      summary: Spend the staged setup
      description: >
        Takes the staged passkey as its bearer, carried in `Authorization: Bearer <passkey>`. A
        match lands the credential and the name as one write to state — closing bootstrap for
        good — and answers the server as it now is; a miss leaves the stage standing. 404 when
        nothing is staged.
      tags: [Server]
      security:
        - setup: []
      responses:
        "201":
          description: The server, set up.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServerInfo"
        "401":
          description: The bearer is not the staged passkey.
        "404":
          description: Nothing is staged — it expired, was never staged, or the server is set up.

  /operator:
    get:
      operationId: getOperator
      summary: Whose operator state the bearer sees
      description: >
        One call whose whole job is to answer what its bearer amounts to — and by answering,
        that the server is listening. The operator's bearer and a live staged passkey alike get
        200 with the state they hold (`active`, or `pending` with `confirmBy` confirming when the
        stage's window shuts); both answers say nothing of the id, the name, or bootstrap. Any
        other bearer gets 401 with an empty body, so a refusal names the token, not the server,
        and tells nothing else; while that keeps `confirmBy` between a server and a stager who
        already holds the passkey, no other route answers the pending bearer a thing.
      tags: [Server]
      security:
        - operator: []
      responses:
        "200":
          description: The state the request's bearer holds.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperatorStatus"
        "401":
          $ref: "#/components/responses/Unauthorised"

  /settings:
    get:
      operationId: getSettings
      summary: The silo's settings, and the facts of its machine
      description: >
        Every key of settings.json and of silo.json, and the resolved state directory. What an
        operator route changes is under `editable`; what none does — the silo.json keys, the state
        directory, and the libraries until they grow routes of their own — is under `readOnly`.
        Operator only.
      tags: [Server]
      security:
        - operator: []
      responses:
        "200":
          description: The settings as they stand.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SettingsReport"
        "401":
          $ref: "#/components/responses/Unauthorised"
    patch:
      operationId: updateSettings
      summary: Change the name, the embedded node or advertising
      description: >
        Applies all of the body or none of it, writes settings.json, and takes effect without a
        restart: the embedded node starts or stops claiming (a job in flight runs to completion),
        the advertisement starts, stops or takes the new name. An empty name is 400. Operator only.
      tags: [Server]
      security:
        - operator: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SettingsPatch"
      responses:
        "200":
          description: The settings as they now stand.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SettingsReport"
        "400":
          description: The patch cannot be applied; nothing was changed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          $ref: "#/components/responses/Unauthorised"

  /libraries:
    get:
      operationId: listLibraries
      summary: The libraries this silo serves
      tags: [Libraries]
      responses:
        "200":
          description: The libraries.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Library"

  /libraries/{library}/ruleset:
    put:
      operationId: setLibraryRuleset
      summary: Name the library's standard ruleset
      description: >
        The ruleset an application to a binding into this library takes when it names none; a null
        name clears it. Written through to settings.json and applied at once. Operator only.
      tags: [Libraries]
      security:
        - operator: []
      parameters:
        - $ref: "#/components/parameters/Library"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LibraryRuleset"
      responses:
        "200":
          description: The library, naming its standard.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Library"
        "401":
          $ref: "#/components/responses/Unauthorised"
        "404":
          description: No such library, or no ruleset by that name.

  /libraries/{library}/scan:
    post:
      operationId: scanLibrary
      summary: Re-read what changed in a library
      description: >
        Walks the library from its top-level folders and re-reads only the sidecars whose
        modification time or size differs from what the index recorded. Operator only.
      tags: [Libraries]
      security:
        - operator: []
      parameters:
        - $ref: "#/components/parameters/Library"
      responses:
        "200":
          description: What the scan did.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScanReport"
        "401":
          $ref: "#/components/responses/Unauthorised"
        "404":
          description: No such library.

  /libraries/{library}/place:
    post:
      operationId: placeFile
      summary: Put a finished file into the library as a presentation of an item
      description: >
        Computes every write the placement would make — folders, the file's destination, the
        sidecars root first — and shows them; applies them unless asked for a dry run; refuses
        them whole, with the findings, when any finding is an error. The file is a path the silo
        can reach; a job's output arrives here by the silo fetching it first. Operator only.
      tags: [Libraries]
      security:
        - operator: []
      parameters:
        - $ref: "#/components/parameters/Library"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlaceRequest"
      responses:
        "200":
          description: The placement, applied unless it was a dry run.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlacementResult"
        "400":
          description: A container document that cannot be read, a lineage that does not hold together, or an item the container does not have.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          $ref: "#/components/responses/Unauthorised"
        "404":
          description: No such library.
        "409":
          description: Refused, with the findings that refuse it.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlacementResult"

  /containers:
    get:
      operationId: listContainers
      summary: The listed roots
      description: >
        Series, films and collections nothing holds, and that are listed. Unlisted containers
        are reachable through the ones that reference them and by id, never from here.
      tags: [Containers]
      parameters:
        - name: library
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: The roots.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ContainerSummary"

  /containers/{id}:
    get:
      operationId: getContainer
      summary: One container, with its presentations
      tags: [Containers]
      parameters:
        - $ref: "#/components/parameters/ContainerID"
        - name: profile
          in: query
          required: false
          description: >
            Leaves only presentations of this profile in the answer. A filter, never a decision:
            the silo does not choose a presentation for a client.
          schema:
            type: string
      responses:
        "200":
          description: The container.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Container"
        "404":
          description: No such container.

  /lookup:
    get:
      operationId: lookup
      summary: A provider's id, resolved to what it names here
      tags: [Containers]
      parameters:
        - name: provider
          in: query
          required: true
          schema:
            type: string
        - name: value
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The containers that carry the reference, directly or through an item.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ContainerSummary"

  /search:
    get:
      operationId: search
      summary: Titles matching, across containers and items
      tags: [Containers]
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
            minLength: 1
      responses:
        "200":
          description: The hits.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SearchHit"

  /rulesets:
    get:
      operationId: listRulesets
      summary: The rulesets the silo holds, at their latest versions
      tags: [Rulesets]
      responses:
        "200":
          description: The rulesets.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RulesetSummary"

  /rulesets/{name}:
    get:
      operationId: getRuleset
      summary: A ruleset, at its latest version or the one asked for
      tags: [Rulesets]
      parameters:
        - $ref: "#/components/parameters/RulesetName"
        - name: version
          in: query
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: The ruleset, as its XML document.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RulesetDocument"
        "404":
          description: No such ruleset or version.
    put:
      operationId: storeRuleset
      summary: Store a ruleset as a new version
      description: >
        Every store is a new version the silo numbers, one sequence across all the ruleset's
        branches; a version is immutable once stored, because a recipe names the version it was
        resolved against. On the standard unless a branch is named. Operator only.
      tags: [Rulesets]
      security:
        - operator: []
      parameters:
        - $ref: "#/components/parameters/RulesetName"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RulesetDocument"
      responses:
        "201":
          description: Stored, with the version the silo gave it.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RulesetDocument"
        "400":
          description: The document is not a ruleset this silo can read, or the branch or version named is not there.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          $ref: "#/components/responses/Unauthorised"
        "409":
          description: The branch named has been promoted, and is closed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"

  /rulesets/{name}/branches:
    get:
      operationId: listBranches
      summary: A ruleset's branches, the standard first
      tags: [Rulesets]
      parameters:
        - $ref: "#/components/parameters/RulesetName"
      responses:
        "200":
          description: The branches.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Branch"
        "404":
          description: No such ruleset.
    post:
      operationId: startBranch
      summary: Start a branch from a version of the standard
      tags: [Rulesets]
      security:
        - operator: []
      parameters:
        - $ref: "#/components/parameters/RulesetName"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewBranch"
      responses:
        "201":
          description: Started.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Branch"
        "400":
          description: The version is not on the standard, or the name is not one a branch can have.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          $ref: "#/components/responses/Unauthorised"
        "404":
          description: No such ruleset.
        "409":
          description: The ruleset already has a branch of that name.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"

  /rulesets/{name}/branches/{branch}/promote:
    post:
      operationId: promoteBranch
      summary: Make a branch's head the standard's next version
      description: >
        A fast-forward: refused, naming them, while the standard has versions the branch has not
        taken in. The branch closes. Operator only.
      tags: [Rulesets]
      security:
        - operator: []
      parameters:
        - $ref: "#/components/parameters/RulesetName"
        - name: branch
          in: path
          required: true
          schema:
            type: string
      responses:
        "201":
          description: The standard's new version.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RulesetSummary"
        "401":
          $ref: "#/components/responses/Unauthorised"
        "404":
          description: No such ruleset or branch.
        "409":
          description: The standard has versions the branch has not taken in, or the branch is closed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"

  /rulesets/{name}/resolve:
    post:
      operationId: resolveRecipe
      summary: What a ruleset would make of sources described by these input specs
      description: >
        A dry run of the resolver: the input specs are joined as a binding's segments are, and the
        answer is a recipe for each of the ruleset's outputs. Nothing is stored and nothing encoded.
      tags: [Rulesets]
      parameters:
        - $ref: "#/components/parameters/RulesetName"
        - name: version
          in: query
          required: false
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResolveRequest"
      responses:
        "200":
          description: A recipe for each of the ruleset's outputs, in its order.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Recipe"
        "400":
          description: An input spec is refused, or the specs cannot be joined.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: No such ruleset or version.
        "422":
          description: A stream no rule decides.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"

  /bindings:
    post:
      operationId: makeBinding
      summary: Bind an entry to the segments of sources it is made from
      description: >
        Checks the binding whole and keeps it, or keeps nothing. A binding names no ruleset; applying
        one is its own operation. Operator only.
      tags: [Bindings]
      security:
        - operator: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewBinding"
      responses:
        "201":
          description: Made.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Binding"
        "400":
          description: The binding cannot be made.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          $ref: "#/components/responses/Unauthorised"

  /bindings/{id}:
    get:
      operationId: getBinding
      summary: One binding, and the ids of its recipes
      tags: [Bindings]
      parameters:
        - $ref: "#/components/parameters/BindingID"
      responses:
        "200":
          description: The binding.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Binding"
        "404":
          description: No such binding.

  /bindings/{id}/recipes:
    post:
      operationId: applyRuleset
      summary: Apply a ruleset to a binding
      description: >
        Resolves the binding once for each output the application makes, at the version named or the
        latest, and keeps a draft for each — or nothing, when any output cannot be resolved. Every
        recipe the binding already has is left as it was, so applying a newer version, or another
        ruleset, is the same call again. Operator only.
      tags: [Bindings]
      security:
        - operator: []
      parameters:
        - $ref: "#/components/parameters/BindingID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Application"
      responses:
        "201":
          description: The new drafts.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StoredRecipe"
        "400":
          description: The ruleset or version does not exist, or it makes no output the application names.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          $ref: "#/components/responses/Unauthorised"
        "404":
          description: No such binding.
        "409":
          description: The branch named has been promoted, and is closed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          description: A stream no rule decides, for one of the outputs.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"

  /recipes/{id}:
    get:
      operationId: getRecipe
      summary: One recipe
      tags: [Bindings]
      parameters:
        - $ref: "#/components/parameters/RecipeID"
      responses:
        "200":
          description: The recipe.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StoredRecipe"
        "404":
          description: No such recipe.
    delete:
      operationId: discardRecipe
      summary: Discard a draft
      description: A committed recipe is the record of what a job ran, and is refused. Operator only.
      tags: [Bindings]
      security:
        - operator: []
      parameters:
        - $ref: "#/components/parameters/RecipeID"
      responses:
        "204":
          description: Discarded.
        "401":
          $ref: "#/components/responses/Unauthorised"
        "404":
          description: No such recipe.
        "409":
          description: The recipe is committed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"

  /bindings/{id}/rules:
    get:
      operationId: getBindingRules
      summary: A binding's own rules
      description: The version in force with its document, and every version there is. Open, as bindings are.
      tags: [Bindings]
      parameters:
        - $ref: "#/components/parameters/BindingID"
      responses:
        "200":
          description: The binding's rules; no version in force when it has none.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BindingRules"
        "404":
          description: No such binding.
    put:
      operationId: setBindingRules
      summary: Store a binding's next version of its rules
      description: >
        Read as a container's rules are, and made the version in force: kept in the silo until the
        binding's first presentation is placed, and in the library beside the item's sidecar after.
        Changes no recipe; apply the rules to the binding again for a draft that carries them.
        Operator only.
      tags: [Bindings]
      security:
        - operator: []
      parameters:
        - $ref: "#/components/parameters/BindingID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewBindingRules"
      responses:
        "200":
          description: The binding's rules, the new version in force.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BindingRules"
        "400":
          description: The rules are refused.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          $ref: "#/components/responses/Unauthorised"
        "404":
          description: No such binding.

  /sources:
    get:
      operationId: listSources
      summary: The sources the silo holds, oldest first
      description: Open, as the queue is. A copy is rendered without the secret that guards its file.
      tags: [Sources]
      responses:
        "200":
          description: The sources.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Source"
    post:
      operationId: registerSource
      summary: Register a source by its input spec
      description: >
        The silo mints the id. A natural key the silo already has answers that source with 200,
        taking the copy given; the same key with a different input spec is 409. The input spec is
        read strictly by the silo itself, so a refusal names the field at fault. Operator only.
      tags: [Sources]
      security:
        - operator: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterSource"
      responses:
        "201":
          description: Registered.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Source"
        "200":
          description: The source the natural key already names.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Source"
        "400":
          description: The input spec is refused.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          $ref: "#/components/responses/Unauthorised"
        "409":
          description: The natural key names a source described otherwise.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"

  /sources/{id}:
    get:
      operationId: getSource
      summary: One source
      tags: [Sources]
      parameters:
        - $ref: "#/components/parameters/SourceID"
      responses:
        "200":
          description: The source.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Source"
        "404":
          description: No such source.

  /sources/{id}/copies:
    post:
      operationId: addSourceCopy
      summary: Record that a node holds a source's file
      description: A copy on a node that already holds one replaces it. Operator only.
      tags: [Sources]
      security:
        - operator: []
      parameters:
        - $ref: "#/components/parameters/SourceID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FileRef"
      responses:
        "200":
          description: The source, holding the copy.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Source"
        "401":
          $ref: "#/components/responses/Unauthorised"
        "404":
          description: No such source.

  /sources/{id}/copies/{node}:
    delete:
      operationId: removeSourceCopy
      summary: Record that a node no longer holds a source's file
      description: A source whose last copy goes is kept. Operator only.
      tags: [Sources]
      security:
        - operator: []
      parameters:
        - $ref: "#/components/parameters/SourceID"
        - name: node
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The source, without the copy.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Source"
        "401":
          $ref: "#/components/responses/Unauthorised"
        "404":
          description: No such source.

  /jobs:
    get:
      operationId: listJobs
      summary: The queue
      tags: [Jobs]
      parameters:
        - name: state
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/JobState"
      responses:
        "200":
          description: The jobs, oldest first.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Job"
    post:
      operationId: createJob
      summary: Make a job from a draft recipe
      description: >
        Commits the recipe, so one recipe is run by one job, and makes the job pending with the
        recipe's encoders as its requirements. Refused while a source of the recipe's binding has no
        copy, since no node could fetch it. Operator only.
      tags: [Jobs]
      security:
        - operator: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewJob"
      responses:
        "201":
          description: Made, pending.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        "401":
          $ref: "#/components/responses/Unauthorised"
        "404":
          description: No such recipe.
        "409":
          description: The recipe is committed, or a source of its binding has no copy.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"

  /jobs/claim:
    post:
      operationId: claimJob
      summary: A node asks for work
      description: >
        The first pending job the node's encoders can do, preferring one of whose every source the
        node holds a copy, leased to it for two minutes and renewed by every progress report.
      tags: [Jobs]
      security:
        - node: []
        - operator: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClaimRequest"
      responses:
        "200":
          description: >
            The job, with its committed recipe and, for each segment of its binding, a copy of the
            segment's source, secret included, and the segment's span; or no job, when there is
            nothing to do.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClaimReply"
        "401":
          $ref: "#/components/responses/Unauthorised"

  /jobs/{id}:
    get:
      operationId: getJob
      summary: One job
      tags: [Jobs]
      parameters:
        - $ref: "#/components/parameters/JobID"
      responses:
        "200":
          description: The job.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        "404":
          description: No such job.

  /jobs/{id}/cancel:
    post:
      operationId: cancelJob
      summary: Cancel a job
      description: A job a node is working on becomes cancelling; the node learns at its next report and stops.
      tags: [Jobs]
      security:
        - operator: []
      parameters:
        - $ref: "#/components/parameters/JobID"
      responses:
        "200":
          description: Cancelled, or cancelling.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        "401":
          $ref: "#/components/responses/Unauthorised"
        "404":
          description: No such job.
        "409":
          description: The job is in a state that cannot be cancelled.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"

  /jobs/{id}/retry:
    post:
      operationId: retryJob
      summary: Offer a failed or cancelled job again
      tags: [Jobs]
      security:
        - operator: []
      parameters:
        - $ref: "#/components/parameters/JobID"
      responses:
        "200":
          description: Pending again, running the same committed recipe.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        "401":
          $ref: "#/components/responses/Unauthorised"
        "404":
          description: No such job.
        "409":
          description: The job is in a state that cannot be retried.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"

  /jobs/{id}/place:
    post:
      operationId: placeJob
      summary: Fetch an encoded job's output and place it
      description: >
        The silo fetches the output from the node that holds it into the library's filesystem,
        places it as the recipe's binding says, in the profile of the recipe's output, and re-scans. Refused, with the reasons, when the
        placement would be.
      tags: [Jobs]
      security:
        - operator: []
      parameters:
        - $ref: "#/components/parameters/JobID"
      responses:
        "200":
          description: Placed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        "401":
          $ref: "#/components/responses/Unauthorised"
        "404":
          description: No such job, or the binding's library is gone.
        "409":
          description: Not encoded, or the placement is refused.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
        "502":
          description: The node holding the output did not give it.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"

  /jobs/{id}/progress:
    post:
      operationId: reportProgress
      summary: A node reports progress, which renews its lease
      tags: [Jobs]
      security:
        - node: []
        - operator: []
      parameters:
        - $ref: "#/components/parameters/JobID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Progress"
      responses:
        "200":
          description: The job's state, which is how a node learns of a cancel.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProgressReply"
        "401":
          $ref: "#/components/responses/Unauthorised"
        "404":
          description: No such job.

  /jobs/{id}/complete:
    post:
      operationId: completeJob
      summary: A node reports the output, where it holds it
      tags: [Jobs]
      security:
        - node: []
        - operator: []
      parameters:
        - $ref: "#/components/parameters/JobID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompleteRequest"
      responses:
        "200":
          description: Encoded, or failed when the layout did not match.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        "401":
          $ref: "#/components/responses/Unauthorised"
        "404":
          description: No such job.
        "409":
          description: The job was not being worked on.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"

  /jobs/{id}/fail:
    post:
      operationId: failJob
      summary: A node gives up on a job
      tags: [Jobs]
      security:
        - node: []
        - operator: []
      parameters:
        - $ref: "#/components/parameters/JobID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FailRequest"
      responses:
        "200":
          description: Failed, or cancelled when a cancel was pending.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        "401":
          $ref: "#/components/responses/Unauthorised"
        "404":
          description: No such job.
        "409":
          description: The job was not being worked on.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"

  /nodes:
    get:
      operationId: listNodes
      summary: Every node the silo knows, pending ones included
      tags: [Nodes]
      security:
        - operator: []
      responses:
        "200":
          description: The nodes, oldest first.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Node"
        "401":
          $ref: "#/components/responses/Unauthorised"
    post:
      operationId: registerNode
      summary: A node announces itself
      description: >
        Recorded pending, and given nothing, until a person approves it. A later registration of
        the same id has to know the secret the node minted on its first run, and then brings the
        node's name and capabilities up to date.
      tags: [Nodes]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NodeRegistration"
      responses:
        "201":
          description: The node's record.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Node"
        "403":
          description: A node of that id exists and the secret is not its.

  /nodes/{id}:
    get:
      operationId: nodeStatus
      summary: A node polls for its approval
      description: The first poll after approval carries the node's token; later ones do not, since the node keeps it.
      tags: [Nodes]
      parameters:
        - $ref: "#/components/parameters/NodeID"
        - name: x-silo-node-secret
          in: header
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The record, and the token once.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NodeStatus"
        "403":
          description: The secret is not the node's.
        "404":
          description: No such node.

  /nodes/{id}/approve:
    post:
      operationId: approveNode
      summary: Let a node take work
      tags: [Nodes]
      security:
        - operator: []
      parameters:
        - $ref: "#/components/parameters/NodeID"
      responses:
        "200":
          description: Approved; its next poll gives it its token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Node"
        "401":
          $ref: "#/components/responses/Unauthorised"
        "404":
          description: No such node.

  /nodes/{id}/revoke:
    post:
      operationId: revokeNode
      summary: Stop a node taking work
      tags: [Nodes]
      security:
        - operator: []
      parameters:
        - $ref: "#/components/parameters/NodeID"
      responses:
        "200":
          description: Revoked; its token stops working at once.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Node"
        "401":
          $ref: "#/components/responses/Unauthorised"
        "404":
          description: No such node.

components:
  securitySchemes:
    operator:
      type: http
      scheme: bearer
      description: The operator's token, which the silo's stored operator credential accepts.
    node:
      type: http
      scheme: bearer
      description: An approved node's token, minted at approval and handed to it once.
    setup:
      type: http
      scheme: bearer
      description: The staged setup's passkey, spent by its confirm — never the credential itself.

  parameters:
    BindingID:
      name: id
      in: path
      required: true
      schema:
        type: string
    RecipeID:
      name: id
      in: path
      required: true
      schema:
        type: string
    SourceID:
      name: id
      in: path
      required: true
      schema:
        type: string
    Library:
      name: library
      in: path
      required: true
      schema:
        type: string
    ContainerID:
      name: id
      in: path
      required: true
      description: Sixteen lowercase hex characters, minted by the shared store. Anything else is 404.
      schema:
        type: string
    RulesetName:
      name: name
      in: path
      required: true
      schema:
        type: string
    JobID:
      name: id
      in: path
      required: true
      schema:
        type: string
    NodeID:
      name: id
      in: path
      required: true
      schema:
        type: string

  responses:
    Unauthorised:
      description: The operator's token is missing or wrong.

  schemas:
    ServerInfo:
      type: object
      required: [id, name, bootstrap]
      properties:
        id:
          type: string
          description: The server's id, minted at its first boot.
        name:
          type: string
        bootstrap:
          type: boolean
          description: Whether the server holds no operator credential yet and waits on setup.

    OperatorStatus:
      type: object
      required: [phase]
      properties:
        phase:
          type: string
          enum: [active, pending]
          description: The bearer's standing — the operator's own, or a setup its passkey can still confirm.
        confirmBy:
          type: string
          format: date-time
          description: The stage's deadline; exactly the pending case carries it.

    SetupRequest:
      type: object
      required: [passkey]
      properties:
        name:
          type: string
          description: The name the server takes where it is set up; its identity's name where absent.
        passkey:
          type: string
          description: The operator's passkey, staged in memory and never stored; its hash alone reaches the state directory, and only on confirm.

    SetupStage:
      type: object
      required: [id, name, confirmBy]
      properties:
        id:
          type: string
          description: The server's id.
        name:
          type: string
          description: The name the setup would take.
        confirmBy:
          type: string
          format: date-time
          description: The staged setup's deadline — ten minutes from staging; a confirm after it finds nothing staged.

    SetupConflict:
      type: object
      required: [confirmBy]
      properties:
        confirmBy:
          type: string
          format: date-time
          description: The standing stage's deadline — once it passes, staging is open again.

    SettingsReport:
      type: object
      required: [editable, readOnly]
      properties:
        editable:
          $ref: "#/components/schemas/EditableSettings"
        readOnly:
          $ref: "#/components/schemas/MachineSettings"

    EditableSettings:
      type: object
      description: What an operator route changes, from settings.json.
      required: [name, embeddedNode, advertise]
      properties:
        name:
          type: string
        embeddedNode:
          type: boolean
          description: Whether the silo runs a node inside itself.
        advertise:
          type: boolean
          description: Whether the silo says where it is through Bonjour.

    MachineSettings:
      type: object
      description: What no route changes — silo.json, the state directory — and the libraries, until they grow routes.
      required: [serverID, host, port, stateDirectory, libraries]
      properties:
        serverID:
          type: string
        host:
          type: string
        port:
          type: integer
        stateDirectory:
          type: string
          description: Where the silo keeps its state, and where operator-credential.reset goes.
        libraries:
          type: array
          items:
            $ref: "#/components/schemas/LibrarySetting"

    LibrarySetting:
      type: object
      required: [id, path]
      properties:
        id:
          type: string
        path:
          type: string

    SettingsPatch:
      type: object
      description: Any of the editable settings; what is left out is unchanged.
      properties:
        name:
          type: string
        embeddedNode:
          type: boolean
        advertise:
          type: boolean

    Problem:
      type: object
      required: [detail]
      properties:
        detail:
          type: string

    Library:
      type: object
      required: [id, containers, presentations]
      properties:
        id:
          type: string
        ruleset:
          type: string
          description: The library's standard, which an application naming no ruleset takes.
        containers:
          type: integer
        presentations:
          type: integer

    ScanReport:
      type: object
      required: [read, unchanged, removed, findings]
      properties:
        read:
          type: integer
        unchanged:
          type: integer
        removed:
          type: integer
        findings:
          type: array
          items:
            $ref: "#/components/schemas/Finding"

    Finding:
      type: object
      required: [severity, text]
      properties:
        severity:
          type: string
          enum: [error, warning]
        path:
          type: string
        text:
          type: string

    LibraryRuleset:
      type: object
      properties:
        ruleset:
          type: string
          description: The ruleset's name; absent or null clears the library's standard.

    PlaceRequest:
      type: object
      required: [containers, item, file]
      properties:
        containers:
          type: array
          description: The container the item is in and every container above it, root first, each as its repository XML document.
          items:
            type: string
        item:
          type: string
        alternative:
          type: string
        profile:
          type: string
        tracks:
          type: array
          items:
            $ref: "#/components/schemas/TrackMapping"
        chapters:
          type: array
          items:
            $ref: "#/components/schemas/Chapter"
        file:
          type: string
          description: The finished file, as a path the silo can reach.
        copy:
          type: boolean
          description: Copy the file into place rather than moving it.
        dryRun:
          type: boolean
          description: Show the writes and make none.

    PlacementResult:
      type: object
      required: [applied, destination, writes, findings]
      properties:
        applied:
          type: boolean
        destination:
          type: string
          description: The file's path in the library, relative to its root.
        presentation:
          type: string
          description: The presentation's id once applied; what the media route takes.
        writes:
          type: array
          description: The declared write targets, one per line.
          items:
            type: string
        findings:
          type: array
          items:
            $ref: "#/components/schemas/Finding"

    JobState:
      type: string
      enum: [pending, claimed, encoding, encoded, placing, placed, failed, cancelling, cancelled]

    FileRef:
      type: object
      required: [holder, url, secret]
      properties:
        holder:
          type: string
          description: The node the file is on.
        url:
          type: string
          format: uri
        path:
          type: string
          description: For the holder's own use, so it opens the file rather than fetching it.
        sizeBytes:
          type: integer
          format: int64
        secret:
          type: string

    NewBinding:
      type: object
      required: [library, containers, item, segments]
      properties:
        library:
          type: string
        containers:
          type: array
          description: The item's container and every one above it, root first, as repository documents.
          items:
            type: string
        item:
          type: string
        alternative:
          type: string
        tracks:
          type: array
          items:
            $ref: "#/components/schemas/TrackMapping"
        chapters:
          type: array
          items:
            $ref: "#/components/schemas/Chapter"
        segments:
          type: array
          items:
            $ref: "#/components/schemas/Segment"

    Segment:
      type: object
      required: [source]
      properties:
        source:
          type: string
          description: The source's id.
        chapters:
          type: object
          required: [from, to]
          properties:
            from:
              type: integer
            to:
              type: integer

    Binding:
      type: object
      required: [id, library, containers, item, tracks, chapters, segments, createdAt, recipes]
      properties:
        id:
          type: string
        library:
          type: string
        containers:
          type: array
          items:
            type: string
        item:
          type: string
        alternative:
          type: string
        tracks:
          type: array
          items:
            $ref: "#/components/schemas/TrackMapping"
        chapters:
          type: array
          items:
            $ref: "#/components/schemas/Chapter"
        segments:
          type: array
          items:
            $ref: "#/components/schemas/Segment"
        createdAt:
          type: string
          format: date-time
        recipes:
          type: array
          description: The ids of the binding's recipes, oldest first.
          items:
            type: string

    Application:
      description: A ruleset applied to a binding.
      type: object
      properties:
        ruleset:
          type: string
          description: The ruleset to apply; the binding's library's own when absent.
        branch:
          type: string
          description: The ruleset's branch, resolved at its head; the standard when absent.
        version:
          type: integer
          description: The ruleset's version; the latest when absent.
        outputs:
          type: array
          description: The ruleset's outputs to make, by profile; an object with no profile names the unqualified one. Every output when absent.
          items:
            type: object
            properties:
              profile:
                type: string

    NewBindingRules:
      type: object
      required: [document]
      properties:
        document:
          type: string
          description: The rules, as a `<rules>` document of rule elements.

    BindingRules:
      type: object
      required: [versions]
      properties:
        activeVersion:
          type: integer
        document:
          type: string
          description: The version in force's document.
        versions:
          type: array
          items:
            type: integer

    StoredRecipe:
      type: object
      required: [id, binding, state, facts, recipe, createdAt]
      properties:
        id:
          type: string
        binding:
          type: string
        state:
          type: string
          enum: [draft, committed]
        facts:
          $ref: "#/components/schemas/SourceFacts"
        recipe:
          $ref: "#/components/schemas/Recipe"
        createdAt:
          type: string
          format: date-time

    RegisterSource:
      type: object
      required: [input]
      properties:
        input:
          description: >
            The source's input spec, as the InputSpec schema describes it. Taken as any JSON object
            and read strictly by the silo, so that a newer format is refused as newer and an unknown
            field is refused by name rather than dropped.
          type: object
          additionalProperties: true
        key:
          $ref: "#/components/schemas/NaturalKey"
        copy:
          $ref: "#/components/schemas/FileRef"

    NaturalKey:
      type: object
      required: [scheme, value]
      properties:
        scheme:
          type: string
        value:
          type: string

    Source:
      type: object
      required: [id, input, copies, createdAt]
      properties:
        id:
          type: string
        input:
          $ref: "#/components/schemas/InputSpec"
        key:
          $ref: "#/components/schemas/NaturalKey"
        copies:
          type: array
          items:
            $ref: "#/components/schemas/SourceCopy"
        createdAt:
          type: string
          format: date-time

    SourceCopy:
      description: A node holding a source's file, without the secret that guards it.
      type: object
      required: [holder, url]
      properties:
        holder:
          type: string
        url:
          type: string
          format: uri
        path:
          type: string
        sizeBytes:
          type: integer
          format: int64

    InputSpec:
      description: What is physically in a source, in the silo's vocabulary.
      type: object
      required: [format, streams]
      properties:
        format:
          type: integer
        label:
          type: string
        medium:
          type: string
          enum: [dvd, bluray, uhd]
        duration:
          type: number
        chapters:
          type: array
          items:
            type: object
            required: [index, start]
            properties:
              index:
                type: integer
              start:
                type: number
              title:
                type: string
        streams:
          type: array
          items:
            $ref: "#/components/schemas/InputStream"
        notes:
          type: array
          items:
            type: object
            required: [text]
            properties:
              stream:
                type: integer
              text:
                type: string

    InputStream:
      type: object
      required: [index, kind, codec]
      properties:
        index:
          type: integer
        kind:
          type: string
          enum: [video, audio, subtitle, other]
        codec:
          type: string
        profile:
          type: string
        width:
          type: integer
        height:
          type: integer
        frameRate:
          type: string
          description: A fraction as ffmpeg spells it, such as 24000/1001, or a whole number.
        interlaced:
          type: boolean
        transfer:
          type: string
        bitDepth:
          type: integer
        channels:
          type: integer
        layout:
          type: string
        language:
          type: string
          description: A BCP 47 tag in canonical form, such as en, es-419 or zh-Hant.
        title:
          type: string
        marks:
          type: array
          items:
            type: string
            enum: [default, forced, commentary, descriptive, hearingImpaired]
        coreOf:
          type: integer

    NewJob:
      type: object
      required: [recipe]
      properties:
        recipe:
          type: string
          description: The id of the draft recipe the job runs.

    Attempt:
      type: object
      required: [node, startedAt]
      properties:
        node:
          type: string
        startedAt:
          type: string
          format: date-time
        endedAt:
          type: string
          format: date-time
        outcome:
          type: string

    Lease:
      type: object
      required: [node, expiresAt]
      properties:
        node:
          type: string
        expiresAt:
          type: string
          format: date-time

    Progress:
      type: object
      required: [updatedAt]
      properties:
        fraction:
          type: number
        seconds:
          type: number
        fps:
          type: number
        speed:
          type: number
        updatedAt:
          type: string
          format: date-time

    EncodeResult:
      type: object
      required: [streams, layoutMatched]
      properties:
        sizeBytes:
          type: integer
          format: int64
        streams:
          type: array
          items:
            type: string
        layoutMatched:
          type: boolean

    PlacementSummary:
      type: object
      required: [destination, writes, placedAt]
      properties:
        destination:
          type: string
        presentation:
          type: string
        writes:
          type: array
          items:
            type: string
        placedAt:
          type: string
          format: date-time

    Job:
      type: object
      required: [id, state, createdAt, updatedAt, recipe, requirements, attempts]
      properties:
        id:
          type: string
        state:
          $ref: "#/components/schemas/JobState"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        recipe:
          type: string
          description: The id of the committed recipe the job runs.
        requirements:
          type: array
          items:
            type: string
        attempts:
          type: array
          items:
            $ref: "#/components/schemas/Attempt"
        lease:
          $ref: "#/components/schemas/Lease"
        progress:
          $ref: "#/components/schemas/Progress"
        output:
          $ref: "#/components/schemas/FileRef"
        result:
          $ref: "#/components/schemas/EncodeResult"
        placement:
          $ref: "#/components/schemas/PlacementSummary"
        failure:
          type: string

    NodeState:
      type: string
      enum: [pending, approved, revoked]

    Node:
      type: object
      required: [id, name, platform, state, capabilities, registeredAt]
      properties:
        id:
          type: string
        name:
          type: string
        platform:
          type: string
        state:
          $ref: "#/components/schemas/NodeState"
        capabilities:
          type: array
          items:
            type: string
        ffmpegVersion:
          type: string
        cores:
          type: integer
        registeredAt:
          type: string
          format: date-time
        approvedAt:
          type: string
          format: date-time
        lastSeenAt:
          type: string
          format: date-time

    NodeRegistration:
      type: object
      required: [id, secret, name, platform, capabilities]
      properties:
        id:
          type: string
        secret:
          type: string
        name:
          type: string
        platform:
          type: string
        capabilities:
          type: array
          items:
            type: string
        ffmpegVersion:
          type: string
        cores:
          type: integer

    NodeStatus:
      type: object
      required: [node]
      properties:
        node:
          $ref: "#/components/schemas/Node"
        token:
          type: string

    ClaimRequest:
      type: object
      required: [node, capabilities]
      properties:
        node:
          type: string
        capabilities:
          type: array
          items:
            type: string

    ClaimReply:
      type: object
      properties:
        job:
          $ref: "#/components/schemas/Job"
        recipe:
          $ref: "#/components/schemas/StoredRecipe"
        segments:
          type: array
          items:
            $ref: "#/components/schemas/ClaimedSegment"

    ClaimedSegment:
      description: >
        One of a claimed job's segments: a copy of its source, secret included, and, when the
        segment is part of its source, its start and end in seconds; no end runs to the source's end.
      type: object
      required: [source, copy]
      properties:
        source:
          type: string
        copy:
          $ref: "#/components/schemas/FileRef"
        start:
          type: number
        end:
          type: number

    ProgressReply:
      type: object
      required: [state]
      properties:
        state:
          $ref: "#/components/schemas/JobState"

    CompleteRequest:
      type: object
      required: [output, result]
      properties:
        output:
          $ref: "#/components/schemas/FileRef"
        result:
          $ref: "#/components/schemas/EncodeResult"

    FailRequest:
      type: object
      required: [reason]
      properties:
        reason:
          type: string

    ContainerSummary:
      type: object
      required: [id, library, type, title, displayTitle, listed]
      properties:
        id:
          type: string
        library:
          type: string
        type:
          type: string
        title:
          type: string
        displayTitle:
          type: string
        year:
          type: integer
        typeLabel:
          type: string
        outline:
          type: string
        listed:
          type: boolean
        parent:
          type: string

    Container:
      type: object
      required: [id, library, type, title, displayTitle, listed, alternatives, features, sequences, extras, children, externalRefs]
      properties:
        id:
          type: string
        library:
          type: string
        type:
          type: string
        title:
          type: string
        displayTitle:
          type: string
        year:
          type: integer
        typeLabel:
          type: string
        outline:
          type: string
        listed:
          type: boolean
        parent:
          type: string
        defaultAlternative:
          type: string
        alternatives:
          type: array
          items:
            $ref: "#/components/schemas/Alternative"
        features:
          type: array
          items:
            $ref: "#/components/schemas/Feature"
        sequences:
          type: array
          items:
            $ref: "#/components/schemas/Sequence"
        extrasAnchor:
          type: string
        extras:
          type: array
          items:
            $ref: "#/components/schemas/Item"
        children:
          type: array
          items:
            $ref: "#/components/schemas/ContainerSummary"
        externalRefs:
          type: array
          items:
            $ref: "#/components/schemas/ExternalRef"

    Alternative:
      type: object
      required: [id, sequence]
      properties:
        id:
          type: string
        sequence:
          type: string
        title:
          type: string
        outline:
          type: string

    Feature:
      type: object
      required: [id, type, participants]
      properties:
        id:
          type: string
        type:
          type: string
        title:
          type: string
        participants:
          type: array
          items:
            $ref: "#/components/schemas/Participant"

    Participant:
      type: object
      required: [name]
      properties:
        name:
          type: string
        role:
          type: string

    Sequence:
      type: object
      required: [exploded, items]
      properties:
        id:
          type: string
        exploded:
          type: string
          enum: [never, allowed, preferred]
        items:
          type: array
          items:
            $ref: "#/components/schemas/Item"

    Item:
      type: object
      required: [optional, externalRefs, presentations]
      properties:
        id:
          type: string
        type:
          type: string
        title:
          type: string
        outline:
          type: string
        optional:
          type: boolean
        container:
          type: string
          description: The child container, for an item of type container.
        ref:
          type: string
          description: "`<container id>#<item>` or a bare item id, for an item that is a position in this order and lives elsewhere."
        externalRefs:
          type: array
          items:
            $ref: "#/components/schemas/ExternalRef"
        presentations:
          type: array
          items:
            $ref: "#/components/schemas/Presentation"

    ExternalRef:
      type: object
      required: [provider, value]
      properties:
        provider:
          type: string
        value:
          type: string

    Presentation:
      type: object
      required: [id, file, tracks, chapters]
      properties:
        id:
          type: string
          description: Stable across rescans; what the media route takes.
        alternative:
          type: string
        profile:
          type: string
        displayName:
          type: string
        file:
          type: string
        source:
          $ref: "#/components/schemas/PresentationSource"
        transform:
          $ref: "#/components/schemas/Transform"
        tracks:
          type: array
          items:
            $ref: "#/components/schemas/TrackMapping"
        chapters:
          type: array
          items:
            $ref: "#/components/schemas/Chapter"

    PresentationSource:
      description: The binding a presentation was made from, with a copy of its segments.
      type: object
      required: [binding, segments]
      properties:
        binding:
          type: string
        segments:
          type: array
          items:
            type: object
            properties:
              scheme:
                type: string
              value:
                type: string
              from:
                type: integer
              to:
                type: integer

    Transform:
      description: Every set of rules that made a presentation, nearest first, then the ruleset.
      type: object
      required: [ruleset, version, layers]
      properties:
        ruleset:
          type: string
        version:
          type: integer
        layers:
          type: array
          items:
            type: object
            required: [version]
            properties:
              binding:
                type: string
              container:
                type: string
              version:
                type: integer
              digest:
                type: string

    TrackMapping:
      type: object
      required: [feature]
      properties:
        feature:
          type: string
        audio:
          type: integer
          description: From one, among the file's audio streams.
        subtitle:
          type: integer
          description: From one, among the file's subtitle streams.

    Chapter:
      type: object
      required: [index, title]
      properties:
        index:
          type: integer
        title:
          type: string

    SearchHit:
      type: object
      required: [container, title]
      properties:
        container:
          type: string
        item:
          type: string
        title:
          type: string

    RulesetSummary:
      type: object
      required: [name, version]
      properties:
        name:
          type: string
        version:
          type: integer

    RulesetDocument:
      type: object
      required: [name, document]
      properties:
        name:
          type: string
        version:
          type: integer
          description: Assigned by the silo; ignored on a store.
        branch:
          type: string
          description: On a store, the branch to store on; the standard when absent. On a read, the version's branch.
        upToDateWith:
          type: integer
          description: On a store on a branch, the standard version the document takes in.
        document:
          type: string
          description: The ruleset's XML.

    Branch:
      type: object
      required: [name, closed]
      properties:
        name:
          type: string
        base:
          type: integer
          description: The standard version it was started from; absent for the standard.
        head:
          type: integer
        upToDateWith:
          type: integer
        closed:
          type: boolean

    NewBranch:
      type: object
      required: [name, from]
      properties:
        name:
          type: string
        from:
          type: integer
          description: The standard version to start from.

    ResolveRequest:
      type: object
      required: [inputs]
      properties:
        inputs:
          type: array
          description: >
            Input specs, as the InputSpec schema describes them, joined in order as a binding's
            segments are. Each is taken as any JSON object and read strictly by the silo.
          items:
            type: object
            additionalProperties: true
        kind:
          type: string
          description: What the item is, as a binding's lineage would say.
        roles:
          type: array
          description: The role each audio stream a feature map names takes from its feature.
          items:
            type: object
            required: [audio, role]
            properties:
              audio:
                type: integer
              role:
                type: string
                enum: [main, commentary, isolatedMusic, descriptive, other]
        mappings:
          type: array
          items:
            $ref: "#/components/schemas/TrackMapping"

    SourceFacts:
      type: object
      required: [audio, subtitles, hints]
      properties:
        kind:
          type: string
        profile:
          type: string
        format:
          type: string
          enum: [dvd, bluray, uhd]
        duration:
          type: number
        video:
          $ref: "#/components/schemas/VideoFacts"
        audio:
          type: array
          items:
            $ref: "#/components/schemas/AudioFacts"
        subtitles:
          type: array
          items:
            $ref: "#/components/schemas/SubtitleFacts"
        hints:
          type: array
          items:
            $ref: "#/components/schemas/FactHint"

    VideoFacts:
      type: object
      required: [absoluteIndex, codec, width, height, interlaced]
      properties:
        absoluteIndex:
          type: integer
        codec:
          type: string
        width:
          type: integer
        height:
          type: integer
        frameRate:
          type: number
        interlaced:
          type: boolean
        hdr:
          type: string
          enum: [hdr10, hlg]
        bitDepth:
          type: integer

    AudioFacts:
      type: object
      required: [index, absoluteIndex, codec, lossless, channels, role, core]
      properties:
        index:
          type: integer
        absoluteIndex:
          type: integer
        codec:
          type: string
        profile:
          type: string
        lossless:
          type: boolean
        channels:
          type: integer
        layout:
          type: string
        language:
          type: string
        role:
          type: string
          enum: [main, commentary, isolatedMusic, descriptive, other]
        core:
          type: boolean
        title:
          type: string

    SubtitleFacts:
      type: object
      required: [index, absoluteIndex, codec, forced, hearingImpaired]
      properties:
        index:
          type: integer
        absoluteIndex:
          type: integer
        codec:
          type: string
        language:
          type: string
        forced:
          type: boolean
        hearingImpaired:
          type: boolean
        title:
          type: string

    FactHint:
      type: object
      required: [text]
      properties:
        stream:
          type: integer
        text:
          type: string

    Recipe:
      type: object
      required: [ruleset, decisions, output, layout, warnings]
      properties:
        ruleset:
          $ref: "#/components/schemas/RulesetRef"
        layers:
          description: The layers above the ruleset the recipe was resolved through, nearest first.
          type: array
          items:
            type: object
            required: [version, digest]
            properties:
              container:
                type: string
              binding:
                type: string
              version:
                type: integer
              digest:
                type: string
        decisions:
          type: array
          items:
            $ref: "#/components/schemas/StreamDecision"
        output:
          $ref: "#/components/schemas/OutputPolicy"
        layout:
          $ref: "#/components/schemas/OutputLayout"
        warnings:
          type: array
          items:
            type: string

    RulesetRef:
      type: object
      required: [name]
      properties:
        name:
          type: string
        version:
          type: integer

    StreamDecision:
      type: object
      required: [kind, sourceIndex, sourceAbsoluteIndex, rule, action]
      properties:
        kind:
          $ref: "#/components/schemas/StreamKind"
        sourceIndex:
          type: integer
        sourceAbsoluteIndex:
          type: integer
        rule:
          type: string
        layer:
          description: The layer the rule came from, by one key — the ruleset's name, or a container's or a binding's id.
          type: object
          properties:
            ruleset:
              type: string
            container:
              type: string
            binding:
              type: string
        action:
          $ref: "#/components/schemas/Action"

    StreamKind:
      type: string
      enum: [video, audio, subtitle]

    Action:
      type: object
      description: >
        Swift's encoding of an enum with associated values: exactly one key, `copy` or `drop`
        with an empty object, or `encode` holding the settings.
      properties:
        copy:
          type: object
        drop:
          type: object
        encode:
          type: object
          required: [_0]
          properties:
            _0:
              $ref: "#/components/schemas/EncodeSettings"

    EncodeSettings:
      type: object
      required: [codec, filters, options]
      properties:
        codec:
          type: string
        preset:
          type: string
        crf:
          type: integer
        bitrate:
          type: string
        channels:
          type: integer
        pixelFormat:
          type: string
        filters:
          type: array
          items:
            type: object
            additionalProperties: true
        options:
          type: object
          additionalProperties:
            type: string

    OutputPolicy:
      type: object
      required: [container]
      properties:
        profile:
          type: string
          description: The output's profile, such as mobile; absent for the unqualified output.
        container:
          type: string

    OutputLayout:
      type: object
      required: [streams]
      properties:
        streams:
          type: array
          items:
            $ref: "#/components/schemas/LayoutStream"

    LayoutStream:
      type: object
      required: [kind, sourceIndex, sourceAbsoluteIndex, outputIndex, outputAbsoluteIndex]
      properties:
        kind:
          $ref: "#/components/schemas/StreamKind"
        sourceIndex:
          type: integer
        sourceAbsoluteIndex:
          type: integer
        outputIndex:
          type: integer
        outputAbsoluteIndex:
          type: integer
