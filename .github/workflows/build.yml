name: build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  Test:
    name: Build and test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      # The toolchain is the one .swift-version names, installed through Swiftly, so a new Swift
      # is a change to that file and nothing here.
      - uses: swift-wire/setup-swift@v1
      # The encoder's integration test runs the real tools on a sample the tools make, and skips
      # itself where they are missing; installing them here is what stops it skipping. Avahi's
      # tools arrive with the node's discovery later and are installed now so the job's shape
      # does not change when it does.
      # Avahi's tools are installed for the discovery module to find; the live Bonjour test still
      # skips itself here, since no daemon runs, and is opted into with SILO_TEST_BONJOUR=1.
      - name: Install ffmpeg, SQLite and Avahi
        run: sudo apt-get update && sudo apt-get install -y ffmpeg libsqlite3-dev avahi-utils
      # On Linux deliberately: nothing below the server imports anything Apple-only, and this job
      # is what keeps that true.
      - name: Test
        run: swift test
