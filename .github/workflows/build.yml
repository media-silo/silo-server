name: build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  Test:
    name: Build and test
    runs-on: ubuntu-24.04
    # A passing run takes around twenty minutes. A test that hangs fails the job at this limit
    # rather than holding the runner for GitHub's six hours, as one waiting on a tool once did.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      # The toolchain is the one .swift-version names, installed through Swiftly, so a new Swift
      # is a change to that file and nothing here.
      - uses: swift-wire/setup-swift@v1
      # The encoder's integration test runs the real tools on a sample the tools make, and skips
      # itself where they are missing; installing them here is what stops it skipping. Avahi's
      # tools arrive with the node's discovery later and are installed now so the job's shape
      # does not change when it does.
      # Avahi's tools are installed for the discovery module to find; the live Bonjour test still
      # skips itself here, since no daemon runs, and is opted into with SILO_TEST_BONJOUR=1.
      - name: Install ffmpeg, SQLite and Avahi
        run: sudo apt-get update && sudo apt-get install -y ffmpeg libsqlite3-dev avahi-utils
      # On Linux deliberately: nothing below the server imports anything Apple-only, and this job
      # is what keeps that true.
      - name: Build tests
        # -v captures the compiler invocations SwiftLint's analyzer reads; redirected to a file to
        # keep the log readable.
        run: swift build --build-tests -v > build.log 2>&1
      - name: Test
        run: swift test --skip-build
      # A debug build and the tests export every internal symbol, so a reference to one in another
      # module links there and fails only when optimised. Building release is what catches that
      # before a deploy does, as it once failed on the middleware box wire-mvc kept internal.
      - name: Build release
        run: swift build -c release
      - name: Install SwiftLint
        run: |
          curl -sL https://github.com/realm/SwiftLint/releases/download/0.63.2/swiftlint_linux_amd64.zip -o swiftlint.zip
          unzip -o swiftlint.zip -d /usr/local/bin
          chmod +x /usr/local/bin/swiftlint
      # On Linux, so that an import only Darwin's Foundation needs is reported here rather than
      # kept because macOS happens to build with it. The admin app is macOS-only and is not built
      # here, so its imports go unchecked.
      - name: SwiftLint unused imports
        run: swiftlint analyze --strict --quiet --compiler-log-path build.log
